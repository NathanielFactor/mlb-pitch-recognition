version: '3.8'

services:
  frontend:
    build:
      context: ../webapp
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../webapp:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ../api:/app
      - /tmp/uploads:/tmp/uploads
    environment:
      - MOCK_MODE=true
      - CORS_ORIGINS=["http://localhost:3000"]
      - UPLOAD_DIR=/tmp/uploads